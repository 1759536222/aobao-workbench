<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="澳澳工作台">
<meta name="theme-color" content="#7CB342">
<title>澳澳工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥑</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥑</text></svg>">
<script src="chart.umd.min.js"></script>
<script src="xlsx.full.min.js"></script>
<style>
/* ============ 多巴胺色系 ============ */
:root {
  --pink-50:#f1f8e9;--pink-100:#dcedc8;--pink-200:#c5e1a5;--pink-300:#aed581;--pink-400:#9ccc65;--pink-500:#7CB342;--pink-600:#558b2f;
  --purple-300:#c5e1a5;--purple-400:#aed581;--purple-500:#9ccc65;
  --blue-300:#dcedc8;--blue-400:#c5e1a5;--blue-500:#aed581;
  --yellow-300:#f0f7e0;--yellow-400:#e0edb8;--yellow-500:#dcedc8;
  --green-300:#aed581;--green-400:#9ccc65;--green-500:#7CB342;
  --orange-300:#d4e9b8;--orange-400:#c5e1a5;--orange-500:#aed581;
  --cyan-300:#e0edb8;--cyan-400:#dcedc8;--cyan-500:#c5e1a5;
  --gray-50:#f9faf7;--gray-100:#f1f8e9;--gray-200:#dcedc8;--gray-300:#c5e1a5;
  --gray-400:#aed581;--gray-500:#7CB342;--gray-600:#558b2f;--gray-700:#33691e;
  --gray-800:#2e5e1e;--gray-900:#1b3a10;
  --sidebar-w:76px;--radius:22px;--radius-sm:16px;--radius-xs:12px;
  --shadow:0 4px 20px rgba(85,139,47,.12);--shadow-lg:0 8px 32px rgba(85,139,47,.18);
  --body-bg:#f1f8e9;--card-bg:#ffffff;--text:#33691e;--text-light:#6b8e4e;
  --accent:#7CB342;
}
@media (prefers-color-scheme:dark){
  :root{--body-bg:#1a2e12;--card-bg:#243d18;--text:#e8f5e0;--text-light:#a8c896;
    --gray-50:#243d18;--gray-100:#2e4a1f;--gray-200:#3a5c28;--gray-300:#52783f;
    --shadow:0 4px 20px rgba(0,0,0,.3);--shadow-lg:0 8px 32px rgba(0,0,0,.4);}
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--body-bg);color:var(--text);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
ul{list-style:none}

/* ============ 侧边栏 ============ */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:#f7fbef;border-right:1px solid #dcedc8;display:flex;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 8px calc(16px + env(safe-area-inset-bottom));z-index:100;overflow-y:auto}
.sidebar-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#dcedc8,#aed581);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px;box-shadow:var(--shadow)}
.nav-item{width:58px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:16px;margin-bottom:10px;cursor:pointer;transition:all .2s;color:var(--text-light);font-size:11px;font-weight:600}
.nav-item:hover{background:#e8f5e0}
.nav-item.active{background:linear-gradient(135deg,var(--green-400),var(--green-600));color:#fff;box-shadow:var(--shadow);transform:translateY(-2px)}
.nav-icon{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#f1f8e9;transition:all .2s}
.nav-item.active .nav-icon{background:rgba(255,255,255,.25)}

/* ============ 主区域 ============ */
#main{margin-left:var(--sidebar-w);height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.topbar{position:sticky;top:0;background:var(--body-bg);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.topbar-title{font-size:20px;font-weight:800;color:var(--gray-800);display:flex;align-items:center;gap:8px}
.topbar-date{background:#fff;border:1px solid #dcedc8;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--text-light);box-shadow:var(--shadow)}
.module{display:none;padding:16px;max-width:760px;margin:0 auto;animation:fadeIn .35s}
.module.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ============ 通用组件 ============ */
.card{background:var(--card-bg);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid #e8f5e0;margin-bottom:16px}
.card-title{font-size:16px;font-weight:800;color:var(--gray-800);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .emoji{font-size:20px}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:600px){.grid-3,.grid-4{grid-template-columns:1fr 1fr}}

.btn{padding:11px 18px;border-radius:99px;font-size:14px;font-weight:700;transition:all .15s;display:inline-flex;align-items:center;gap:5px;justify-content:center}
.btn-primary{background:linear-gradient(135deg,var(--pink-400),var(--pink-600));color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.btn-primary:active{transform:scale(.96)}
.btn-ghost{background:#f1f8e9;color:var(--pink-600)}
.btn-ghost:hover{background:#dcedc8}
.btn-danger{color:#558b2f;font-size:12px;padding:6px 10px;border-radius:10px}
.btn-danger:hover{background:#f1f8e9}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-block{width:100%}

.input,.select,.textarea{width:100%;padding:12px 14px;border:2px solid #dcedc8;border-radius:var(--radius-sm);background:var(--card-bg);color:var(--text);font-size:14px;transition:all .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--pink-400);box-shadow:0 0 0 3px rgba(85,139,47,.12)}
.textarea{resize:vertical;min-height:80px;border-radius:var(--radius-sm)}
.field{margin-bottom:14px}
.field-label{display:block;font-size:13px;font-weight:700;color:var(--text-light);margin-bottom:6px}

.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f1f8e9}
.list-item:last-child{border-bottom:none}
.list-item-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.list-item-body{flex:1;min-width:0}
.list-item-title{font-weight:700;font-size:14.5px;color:var(--gray-800)}
.list-item-sub{font-size:12px;color:var(--text-light);margin-top:2px}
.list-item-action{flex-shrink:0}

.empty-state{text-align:center;padding:28px 16px;color:var(--text-light)}
.empty-state .emoji{font-size:42px;margin-bottom:8px;opacity:.7}
.empty-state .text{font-size:13px}

.progress{height:10px;background:#f1f8e9;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink-400),var(--pink-600));border-radius:99px;transition:width .5s}

.bottom-pad{height:40px}

/* 勾选框 */
.checkbox{width:24px;height:24px;border:2.5px solid #dcedc8;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;flex-shrink:0}
.checkbox.checked{background:linear-gradient(135deg,var(--green-400),var(--green-500));border-color:transparent;color:#fff}
.checkbox.checked::after{content:'✓';font-size:14px;font-weight:800}
.todo-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius-sm);background:#f9faf7;margin-bottom:10px;transition:all .15s;border:1.5px solid transparent}
.todo-item.done{opacity:.55;border-color:#e2fbe8;background:#f0fdf4}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-light)}
.todo-text{flex:1;font-size:15px;font-weight:600;color:var(--gray-800)}

/* 统计卡片 */
.stat-card{background:var(--card-bg);border-radius:var(--radius);padding:18px 12px;text-align:center;box-shadow:var(--shadow);border:1px solid #e8f5e0;transition:all .15s;cursor:pointer;position:relative;overflow:hidden}
.stat-card:active{transform:scale(.97)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--card-color,var(--pink-400))}
.stat-icon{font-size:34px;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:800;color:var(--card-color,var(--pink-500));line-height:1}
.stat-unit{font-size:12px;color:var(--text-light);margin-left:2px}
.stat-label{font-size:12px;color:var(--text-light);margin-top:6px;font-weight:600}

/* 彩色标签 */
.badge{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700}
.badge-pink{background:#dcedc8;color:#33691e}
.badge-purple{background:#e6f2e6;color:#33691e}
.badge-blue{background:#e8f5e0;color:#33691e}
.badge-yellow{background:#f0f7e0;color:#558b2f}
.badge-green{background:#dcedc8;color:#33691e}
.badge-orange{background:#e6f2e6;color:#558b2f}
.tag{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#dcedc8;color:#33691e;margin:2px}

/* 多巴胺色卡片 */
.dopa-pink{--card-color:#7CB342}
.dopa-purple{--card-color:#558b2f}
.dopa-blue{--card-color:#33691e}
.dopa-yellow{--card-color:#9ccc65}
.dopa-green{--card-color:#aed581}
.dopa-orange{--card-color:#dcedc8}
.dopa-cyan{--card-color:#c5e1a5}

/* 移动端 */
#mobileMenuBtn{display:none;width:40px;height:40px;border-radius:12px;background:#fff;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow);margin-right:10px}
@media(max-width:600px){
  :root{--sidebar-w:66px}
  #sidebar{padding:12px 4px}
  .nav-item{width:52px;font-size:10px;padding:8px 2px}
  .nav-icon{width:30px;height:30px;font-size:17px;border-radius:10px}
  .sidebar-avatar{width:40px;height:40px;font-size:22px}
  #main{margin-left:var(--sidebar-w)}
  .topbar{padding:12px 14px}
  .topbar-title{font-size:17px}
  .module{padding:12px}
  .stat-value{font-size:24px}
}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99}
#overlay.show{display:block}

#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--gray-800);color:#fff;padding:11px 24px;border-radius:99px;font-size:14px;z-index:9999;transition:transform .3s;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}

/* 弹窗 */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{background:var(--card-bg);border-radius:var(--radius);padding:20px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);border:1px solid #dcedc8}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;color:var(--gray-800)}

/* 引导页 */
.onboard{display:none;position:fixed;inset:0;background:linear-gradient(180deg,#f1f8e9 0%,#dcedc8 100%);z-index:500;overflow-y:auto;padding:24px 20px;flex-direction:column;align-items:center}
.onboard.show{display:flex}
.onboard-avatar{font-size:60px;width:90px;height:90px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);margin:24px 0 12px}
.onboard-title{color:var(--gray-800);font-size:26px;font-weight:800;margin-bottom:4px}
.onboard-sub{color:var(--text-light);font-size:14px;margin-bottom:24px;text-align:center}
.onboard-card{background:#fff;border-radius:var(--radius);padding:20px;width:100%;max-width:420px;margin-bottom:16px;box-shadow:var(--shadow)}
.onboard-card h3{font-size:16px;margin-bottom:12px;color:var(--gray-800)}
.onboard-modules{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.onboard-mod{display:flex;align-items:center;gap:8px;padding:11px;border-radius:14px;border:2px solid #f1f8e9;cursor:pointer;transition:all .12s;font-size:13px;font-weight:600}
.onboard-mod:hover{border-color:#c5e1a5}
.onboard-mod.checked{border-color:var(--pink-400);background:#f1f8e9}
.onboard-mod .mod-emoji{font-size:18px}
.onboard-mod .mod-check{margin-left:auto;width:20px;height:20px;border-radius:6px;border:2px solid #dcedc8;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.onboard-mod.checked .mod-check{background:var(--pink-500);border-color:var(--pink-500);color:#fff}
.onboard-mod.checked .mod-check::after{content:'✓';font-size:13px;font-weight:800}
.onboard-btn{background:linear-gradient(135deg,var(--pink-400),var(--pink-600));color:#fff;border:none;padding:15px 50px;border-radius:99px;font-size:17px;font-weight:800;cursor:pointer;margin-top:8px;box-shadow:var(--shadow-lg)}

/* 设置项 */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #f1f8e9;gap:12px}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:14px;font-weight:700;flex-shrink:0}
.setting-desc{font-size:12px;color:var(--text-light);margin-top:2px}
.setting-input{padding:9px 12px;border:2px solid #dcedc8;border-radius:12px;background:var(--card-bg);color:var(--text);min-width:90px;flex-shrink:0;text-align:center;font-weight:700}
.module-toggle{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f1f8e9}
.module-toggle:last-child{border-bottom:none}
.toggle-switch{width:46px;height:26px;background:#dcedc8;border-radius:99px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle-switch.on{background:linear-gradient(135deg,var(--pink-400),var(--pink-600))}
.toggle-switch::after{content:'';position:absolute;top:2.5px;left:2.5px;width:21px;height:21px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle-switch.on::after{left:22px}
.mod-name-input{flex:1;padding:8px 12px;border:2px solid #dcedc8;border-radius:12px;background:var(--card-bg);color:var(--text);font-size:13px;font-weight:700;min-width:0}

/* 倒计时 */
.countdown-item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--radius-sm);background:#f9faf7;margin-bottom:10px;border:1.5px solid #e8f5e0}
.countdown-days{text-align:center;flex-shrink:0;min-width:64px}
.countdown-num{font-size:32px;font-weight:800;color:var(--pink-500);line-height:1}
.countdown-unit{font-size:11px;color:var(--text-light);font-weight:600}
.countdown-info{flex:1;min-width:0}
.countdown-name{font-weight:800;font-size:15px;color:var(--gray-800)}
.countdown-date{font-size:12px;color:var(--text-light);margin-top:2px}

/* 经期 */
.period-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.period-day{padding:10px 4px;border-radius:14px;background:#f9faf7;font-size:13px;font-weight:700;color:var(--text-light);cursor:pointer;transition:all .12s}
.period-day:hover{background:#dcedc8}
.period-day.today{background:linear-gradient(135deg,var(--pink-400),var(--pink-600));color:#fff;box-shadow:var(--shadow)}
.period-day.period{background:#dcedc8;color:#33691e}
.period-day.predicted{background:#f0f7e0;color:#558b2f}
.period-day.ovulation{background:#e8f5e0;color:#33691e}

/* 图表 */
.chart-wrap{position:relative;height:220px;margin-top:8px}

/* 首页每日一句 */
.quote-card{background:linear-gradient(135deg,#f1f8e9,#dcedc8);border-radius:var(--radius);padding:22px;text-align:center;margin-bottom:16px;border:1px solid #c5e1a5;position:relative}
.quote-eng{font-size:18px;font-weight:700;font-style:italic;color:var(--pink-600);margin:10px 0 6px;line-height:1.5}
.quote-cn{font-size:14px;color:var(--text-light);margin-bottom:14px}
</style>
</head>
<body>

<!-- 引导页 -->
<div class="onboard" id="onboard">
  <div class="onboard-avatar">🥑</div>
  <div class="onboard-title">澳澳工作台</div>
  <div class="onboard-sub">多巴胺风格的生活管理小助手<br>选择你需要的模块开始吧</div>
  <div class="onboard-card">
    <h3>✨ 选择模块</h3>
    <p style="font-size:13px;color:var(--text-light);margin-bottom:12px;">之后可在设置中调整</p>
    <div class="onboard-modules" id="onboardModules"></div>
  </div>
  <button class="onboard-btn" onclick="finishOnboard()">开始吧 ✨</button>
</div>

<!-- 侧边栏 -->
<aside id="sidebar">
  <div class="sidebar-avatar">👧</div>
  <nav class="sidebar-nav" id="navList"></nav>
</aside>
<div id="overlay"></div>

<!-- 主区域 -->
<main id="main">
  <header class="topbar">
    <div class="topbar-title" id="topbarTitle">🥑 澳澳工作台</div>
    <div class="topbar-date" id="topbarDate"></div>
  </header>
  <div id="moduleContainer"></div>
  <div class="bottom-pad"></div>
</main>

<!-- 弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox">
    <div class="modal-title" id="modalTitle">提示</div>
    <div id="modalBody"></div>
    <div style="display:flex;gap:10px;margin-top:18px;" id="modalActions">
      <button class="btn btn-ghost btn-block" id="modalCancel">取消</button>
      <button class="btn btn-primary btn-block" id="modalOk">确定</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   澳澳工作台 v3 — 多巴胺风格
============================================================ */
const STORE_KEY = 'aobao_workbench_v3';
const todayStr = () => new Date().toISOString().slice(0,10);

// ===== 模块定义（参考图定制）=====
const MODULE_DEFS = {
  home:      { emoji:'🏠', name:'首页', desc:'每日一句+今日概览', default:true, color:'dopa-pink' },
  plan:      { emoji:'📝', name:'计划', desc:'每日待办清单', default:true, color:'dopa-blue' },
  goal:      { emoji:'🎯', name:'目标', desc:'体重/存款目标', default:true, color:'dopa-purple' },
  dates:     { emoji:'📅', name:'重要日期', desc:'生日/纪念日', default:true, color:'dopa-yellow' },
  fitness:   { emoji:'💪', name:'健身', desc:'运动/体重记录', default:true, color:'dopa-orange' },
  water:     { emoji:'💧', name:'喝水计划', desc:'每日喝水打卡', default:true, color:'dopa-cyan' },
  diet:      { emoji:'🥗', name:'饮食计划', desc:'三餐记录+卡路里', default:true, color:'dopa-green' },
  expense:   { emoji:'💸', name:'日常支出', desc:'记账/支出', default:true, color:'dopa-green' },
  morning:   { emoji:'🌅', name:'早起', desc:'早起打卡', default:true, color:'dopa-yellow' },
  sleep:     { emoji:'🌙', name:'睡觉', desc:'睡眠记录', default:true, color:'dopa-purple' },
  countdown: { emoji:'⏰', name:'倒计时', desc:'考试/旅行倒计时', default:true, color:'dopa-pink' },
  period:    { emoji:'🌷', name:'经期', desc:'经期记录预测', default:true, color:'dopa-pink' },
  settings:  { emoji:'⚙️', name:'设置', desc:'模块/数据/目标', default:true, color:'' }
};

// ===== 数据层 =====
let DB = {
  onboarded:false,
  moduleConfig:{},
  settings:{goalWeight:null,goalSavings:null,dailyBudget:100,wakeTime:'07:00',waterGoal:8,calorieGoal:1800,apiKey:'',apiUrl:'https://api.deepseek.com/v1',apiModel:'deepseek-chat'},
  weights:[], todos:[], sports:[], sleeps:[], accounts:[], waters:[], diets:[],
  countdowns:[], dates:[], readings:[], periods:[], goals:[], morningStreak:0, lastMorning:null,
  quoteIndex:0
};

let storageAvailable=true;
function loadDB(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){ const p=JSON.parse(raw); DB=Object.assign(DB,p); }
  }catch(e){
    console.warn('localStorage不可用，使用内存模式',e);
    storageAvailable=false;
  }
  // 确保所有字段存在
  if(!DB.moduleConfig) DB.moduleConfig={};
  const arrays=['weights','todos','sports','sleeps','accounts','waters','diets','countdowns','dates','readings','periods','goals'];
  arrays.forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[]});
  if(!DB.settings)DB.settings={goalWeight:null,goalSavings:null,dailyBudget:100,wakeTime:'07:00',waterGoal:8,calorieGoal:1800,apiKey:'',apiUrl:'https://api.deepseek.com/v1',apiModel:'deepseek-chat'};
  if(!DB.settings.waterGoal)DB.settings.waterGoal=8;
  if(!DB.settings.calorieGoal)DB.settings.calorieGoal=1800;
  Object.keys(MODULE_DEFS).forEach(k=>{
    if(!DB.moduleConfig[k]) DB.moduleConfig[k]={enabled:MODULE_DEFS[k].default,name:MODULE_DEFS[k].name};
    else DB.moduleConfig[k].name=MODULE_DEFS[k].name;
  });
  // 版本迁移：v3.1 起经期模块默认开启，老用户自动启用（仅当用户从未手动关过则保持开启）
  if(!DB.schemaVersion || DB.schemaVersion < 3.1){
    if(DB.moduleConfig.period && DB.moduleConfig.period.enabled===false && !DB._periodToggled){
      DB.moduleConfig.period.enabled=true;
    }
    DB.schemaVersion=3.1;
  }
  // v3.2：喝水计划模块（原游泳位置），自动启用
  if(!DB.schemaVersion || DB.schemaVersion < 3.2){
    if(DB.moduleConfig.water && DB.moduleConfig.water.enabled===false && !DB._waterToggled){
      DB.moduleConfig.water.enabled=true;
    }
    DB.schemaVersion=3.2;
  }
  // v3.3：饮食计划模块，自动启用
  if(!DB.schemaVersion || DB.schemaVersion < 3.3){
    if(DB.moduleConfig.diet && DB.moduleConfig.diet.enabled===false && !DB._dietToggled){
      DB.moduleConfig.diet.enabled=true;
    }
    DB.schemaVersion=3.3;
  }
}
function saveDB(){
  if(!storageAvailable)return;
  try{localStorage.setItem(STORE_KEY,JSON.stringify(DB));}catch(e){console.warn('保存失败',e)}
}
loadDB();

// ===== 工具函数 =====
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function fmtDate(d){const dt=new Date(d);return `${dt.getMonth()+1}月${dt.getDate()}日`}
function fmtWeekday(d){return ['日','一','二','三','四','五','六'][new Date(d).getDay()]}
function fmtDuration(mins){const h=Math.floor(mins/60),m=mins%60;if(h===0)return`${m}分`;if(m===0)return`${h}小时`;return`${h}小时${m}分`}
function calcSleepDuration(s,e){let[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);let m=(eh*60+em)-(sh*60+sm);if(m<=0)m+=1440;return m}
function daysBetween(d1,d2){return Math.round((new Date(d2)-new Date(d1))/86400000)}

// ===== AI调用层 =====
async function callAI(prompt,systemPrompt){
  if(!DB.settings.apiKey)return null;
  try{
    const res=await fetch(DB.settings.apiUrl+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+DB.settings.apiKey},body:JSON.stringify({model:DB.settings.apiModel,messages:[{role:'system',content:systemPrompt||'你是一个生活管理助手'},{role:'user',content:prompt}],temperature:.8})});
    if(!res.ok)throw new Error('API错误');
    const data=await res.json(); return data.choices[0].message.content;
  }catch(e){console.warn('AI fail',e);return null}
}
function hasAI(){return !!DB.settings.apiKey}

function getEnabledModules(){return Object.keys(MODULE_DEFS).filter(k=>k!=='settings'&&DB.moduleConfig[k]?.enabled).concat('settings')}
function buildSidebar(){
  const nav=document.getElementById('navList');
  nav.innerHTML=getEnabledModules().map(k=>{
    const def=MODULE_DEFS[k]; const name=DB.moduleConfig[k]?.name||def.name;
    return `<div class="nav-item ${k==='home'?'active':''}" data-module="${k}"><div class="nav-icon">${def.emoji}</div><div>${name}</div></div>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(item=>item.addEventListener('click',()=>switchModule(item.dataset.module)));
}
function switchModule(key){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.module===key));
  document.querySelectorAll('.module').forEach(m=>m.classList.toggle('active',m.id==='module-'+key));
  document.getElementById('topbarTitle').innerHTML=`🥑 ${DB.moduleConfig[key]?.name||MODULE_DEFS[key].name}`;
  document.getElementById('overlay').classList.remove('show');
  renderModule(key);
  document.getElementById('main').scrollTo(0,0);
}
function renderModule(key){const fn=RENDERERS[key];if(fn)fn()}

function renderOnboard(){
  const container=document.getElementById('onboardModules');
  container.innerHTML=Object.keys(MODULE_DEFS).filter(k=>k!=='settings').map(k=>{
    const def=MODULE_DEFS[k];
    return `<div class="onboard-mod ${def.default?'checked':''}" data-key="${k}"><span class="mod-emoji">${def.emoji}</span><span>${def.name}</span><span class="mod-check"></span></div>`;
  }).join('');
  container.querySelectorAll('.onboard-mod').forEach(el=>el.addEventListener('click',()=>el.classList.toggle('checked')));
}
function finishOnboard(){
  document.querySelectorAll('#onboardModules .onboard-mod').forEach(el=>{
    const k=el.dataset.key;
    if(DB.moduleConfig[k]) DB.moduleConfig[k].enabled=el.classList.contains('checked');
  });
  DB.onboarded=true; saveDB();
  document.getElementById('onboard').classList.remove('show');
  buildSidebar(); buildModules();

  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));

let weightChartInstance=null;

  const wrap=document.getElementById('weightChart')?.parentElement;if(!wrap)return;if(weightChartInstance){weightChartInstance.destroy();weightChartInstance=null}

function addSleep(){const start=document.getElementById('sleepStart').value;const end=document.getElementById('sleepEnd').value;if(!start||!end)return toast('请填写时间');if(!sleepQuality)return toast('请选择质量');const dur=calcSleepDuration(start,end);const today=todayStr();const idx=DB.sleeps.findIndex(s=>s.date===today);const rec={date:today,start,end,quality:sleepQuality,duration:dur};if(idx>=0)DB.sleeps[idx]=rec;else DB.sleeps.push(rec);saveDB();sleepQuality=0;toast('睡眠已记录 ✓');RENDERERS.sleep();RENDERERS.home()}

RENDERERS.period=function(){
  const c=document.getElementById('content-period');
  const today=todayStr();
  const lastPeriod=DB.periods.sort((a,b)=>b.start.localeCompare(a.start))[0];
  // 生成当前月日历
  const now=new Date();
  const year=now.getFullYear(),month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const days=[];for(let i=0;i<firstDay;i++)days.push(null);for(let i=1;i<=daysInMonth;i++)days.push(i);
  c.innerHTML=`
    <div class="card" style="background:linear-gradient(135deg,#dcedc8,#c5e1a5);color:#2e5e1e;">
      <div style="font-size:14px;font-weight:700;opacity:.8;">最近一次经期</div>
      <div style="font-size:28px;font-weight:800;margin:6px 0;">${lastPeriod?fmtDate(lastPeriod.start):'未记录'}</div>
      <div style="font-size:13px;opacity:.8;">${lastPeriod?`周期 ${lastPeriod.cycle||28} 天 · 持续 ${lastPeriod.days||5} 天`:''}</div>
    </div>
    <div class="card">
      <div class="card-title"><span class="emoji">➕</span>记录经期</div>
      <div class="grid grid-2">
        <div class="field"><label class="field-label">开始日期</label><input type="date" class="input" id="periodStart" value="${today}"></div>
        <div class="field"><label class="field-label">持续天数</label><input type="number" class="input" id="periodDays" value="5" min="1" max="10"></div>
      </div>
      <div class="field"><label class="field-label">周期天数</label><input type="number" class="input" id="periodCycle" value="28" min="21" max="35"></div>
      <button class="btn btn-primary btn-block" onclick="addPeriod()">保存</button>
    </div>
    <div class="card">
      <div class="card-title"><span class="emoji">📅</span>${year}年${month+1}月</div>
      <div class="period-calendar">
        <div style="font-size:12px;color:var(--text-light);padding:6px;">日</div><div style="font-size:12px;color:var(--text-light);padding:6px;">一</div><div style="font-size:12px;color:var(--text-light);padding:6px;">二</div><div style="font-size:12px;color:var(--text-light);padding:6px;">三</div><div style="font-size:12px;color:var(--text-light);padding:6px;">四</div><div style="font-size:12px;color:var(--text-light);padding:6px;">五</div><div style="font-size:12px;color:var(--text-light);padding:6px;">六</div>
        ${days.map(d=>{
          if(!d)return '<div></div>';
          const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          let cls='period-day';
          if(ds===today)cls+=' today';
          // 经期
          const inPeriod=DB.periods.some(p=>{if(!p.start)return false;const s=new Date(p.start);const e=new Date(s);e.setDate(s.getDate()+((p.days||5)-1));const cur=new Date(ds);return cur>=s&&cur<=e;});
          // 预测下次
          const last=DB.periods.sort((a,b)=>b.start.localeCompare(a.start))[0];
          let predicted=false;
          if(last){const next=new Date(last.start);next.setDate(next.getDate()+(last.cycle||28));const nextEnd=new Date(next);nextEnd.setDate(next.getDate()+((last.days||5)-1));const cur=new Date(ds);if(cur>=next&&cur<=nextEnd)predicted=true;}
          if(inPeriod)cls+=' period';else if(predicted)cls+=' predicted';
          return `<div class="${cls}">${d}</div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:12px;font-size:12px;">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#dcedc8;"></span> 经期</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#f0f7e0;"></span> 预测</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#7CB342,#33691e);"></span> 今天</span>
      </div>
    </div>
  `;
};
function addPeriod(){const start=document.getElementById('periodStart').value;const days=parseInt(document.getElementById('periodDays').value)||5;const cycle=parseInt(document.getElementById('periodCycle').value)||28;if(!start)return toast('请选日期');DB.periods.push({id:uid(),start,days,cycle});saveDB();toast('已记录 ✓');RENDERERS.period();RENDERERS.home()}

function exportJSON(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`澳澳工作台_${todayStr()}.json`;a.click();URL.revokeObjectURL(url);toast('已导出 ✓')}
function exportExcel(){if(typeof XLSX==='undefined')return toast('xlsx库未加载');const wb=XLSX.utils.book_new();const sheets={'体重':[['日期','体重'],...DB.weights.map(w=>[w.date,w.weight])],'运动':[['日期','类型','时长','消耗'],...DB.sports.map(s=>[s.date,s.type,s.duration,s.calories])],'喝水':[['日期','杯数','估算ml'],...DB.waters.map(w=>[w.date,w.count,w.count*250])],'饮食':[['日期','餐型','食物','卡路里'],...DB.diets.map(d=>[d.date,({breakfast:'早餐',lunch:'午餐',dinner:'晚餐',snack:'加餐'})[d.mealType]||d.mealType,d.food,d.calories])],'支出':[['日期','分类','金额','备注'],...DB.accounts.filter(a=>a.type==='expense').map(a=>[a.date,a.category,a.amount,a.note])],'睡眠':[['日期','入睡','起床','时长','质量'],...DB.sleeps.map(s=>[s.date,s.start,s.end,s.duration,s.quality])],'待办':[['日期','事项','完成'],...DB.todos.map(t=>[t.date,t.text,t.done?'是':'否'])],'经期':[['开始','持续','周期'],...DB.periods.map(p=>[p.start,p.days,p.cycle])],'重要日期':[['名称','日期','类型'],...DB.dates.map(d=>[d.name,d.date,d.type])]};Object.keys(sheets).forEach(n=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sheets[n]),n));XLSX.writeFile(wb,`澳澳工作台_${todayStr()}.xlsx`);toast('Excel已导出 ✓')}
function importData(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const data=JSON.parse(e.target.result);showConfirm('导入数据','确定覆盖当前数据？',()=>{DB=Object.assign({onboarded:true,moduleConfig:{},settings:{},weights:[],todos:[],sports:[],sleeps:[],accounts:[],waters:[],diets:[],countdowns:[],dates:[],readings:[],periods:[],goals:[],morningStreak:0,lastMorning:null,quoteIndex:0},data);Object.keys(MODULE_DEFS).forEach(k=>{if(!DB.moduleConfig[k])DB.moduleConfig[k]={enabled:MODULE_DEFS[k].default,name:MODULE_DEFS[k].name};});saveDB();buildSidebar();buildModules();switchModule('home');toast('数据已导入 ✓')})}catch(err){toast('导入失败：格式错误')}};reader.readAsText(file);event.target.value=''}
function clearAllData(){showConfirm('清空全部数据','确定清空所有记录？不可恢复！',()=>{DB={onboarded:true,moduleConfig:{},settings:{goalWeight:null,goalSavings:null,dailyBudget:100,wakeTime:'07:00',waterGoal:8,calorieGoal:1800,apiKey:'',apiUrl:'https://api.deepseek.com/v1',apiModel:'deepseek-chat'},weights:[],todos:[],sports:[],sleeps:[],accounts:[],waters:[],diets:[],countdowns:[],dates:[],readings:[],periods:[],goals:[],morningStreak:0,lastMorning:null,quoteIndex:0};Object.keys(MODULE_DEFS).forEach(k=>DB.moduleConfig[k]={enabled:MODULE_DEFS[k].default,name:MODULE_DEFS[k].name});saveDB();buildSidebar();buildModules();switchModule('home');toast('数据已清空')})}

// PWA
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

// 启动
if(!DB.onboarded){renderOnboard();document.getElementById('onboard').classList.add('show');}
else{buildSidebar();buildModules();switchModule('home');}
</script>
</body>
</html>
